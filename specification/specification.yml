openapi: 3.1.0
info:
  title: API сервер для проекта «Шесть городов»
  description: |-
    Список ресурсов и маршрутов сервера «Шесть городов».

    Авторизация выполняется по JWT-токену, который клиент получает при входе
    и передаёт в заголовке `Authorization: Bearer <token>`. Сессии не используются,
    поэтому отдельного ресурса для выхода нет: для выхода клиент удаляет токен у себя.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Локальный сервер. Порт задаётся переменной окружения PORT.
tags:
  - name: users
    description: Регистрация, вход и проверка состояния пользователя.
  - name: offers
    description: Предложения по аренде.
  - name: favorites
    description: Избранные предложения пользователя.
  - name: comments
    description: Комментарии к предложениям.

paths:
  /users/register:
    post:
      tags:
        - users
      summary: Регистрация пользователя
      security: []
      description: Создаёт нового пользователя. Доступно только анонимным клиентам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Пользователь создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Клиент уже авторизован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким email уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/login:
    post:
      tags:
        - users
      summary: Вход в закрытую часть приложения
      security: []
      description: Проверяет email и пароль и возвращает токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUser'
      responses:
        '200':
          description: Вход выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль, либо пользователь не существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - users
      summary: Проверка состояния пользователя
      description: Возвращает информацию об авторизованном пользователе по токену.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Клиент авторизован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/avatar:
    post:
      tags:
        - users
      summary: Загрузка аватара
      description: Загружает изображение аватара текущего пользователя в формате .jpg или .png.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '201':
          description: Аватар загружен.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    example: /upload/avatar-1.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /offers:
    get:
      tags:
        - offers
      summary: Список предложений
      security: []
      description: |-
        Возвращает список предложений, отсортированный по дате публикации (сначала новые).
        По умолчанию не больше 60 предложений. Доступно всем клиентам.
      parameters:
        - name: limit
          in: query
          required: false
          description: Количество предложений в ответе.
          schema:
            type: integer
            minimum: 1
            default: 60
      responses:
        '200':
          description: Список предложений.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - offers
      summary: Создание предложения
      description: Создаёт новое предложение. Автором становится текущий пользователь.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOffer'
      responses:
        '201':
          description: Предложение создано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /offers/premium:
    get:
      tags:
        - offers
      summary: Премиальные предложения для города
      security: []
      description: |-
        Возвращает не больше 3 предложений с флагом «Премиум» для указанного города,
        отсортированных по дате публикации (сначала новые). Доступно всем клиентам.
      parameters:
        - name: city
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/City'
      responses:
        '200':
          description: Список премиальных предложений.
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/OfferPreview'
        '400':
          $ref: '#/components/responses/BadRequest'

  /offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - offers
      summary: Детальная информация о предложении
      security: []
      description: Возвращает все поля предложения без комментариев. Доступно всем клиентам.
      responses:
        '200':
          description: Предложение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - offers
      summary: Редактирование предложения
      description: Обновляет переданные поля предложения. Редактировать можно только свои предложения.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOffer'
      responses:
        '200':
          description: Предложение обновлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - offers
      summary: Удаление предложения
      description: Удаляет предложение вместе с комментариями. Удалять можно только свои предложения.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Предложение удалено.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /favorites:
    get:
      tags:
        - favorites
      summary: Список избранных предложений
      description: Возвращает все предложения, которые текущий пользователь добавил в избранное.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список избранных предложений.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    put:
      tags:
        - favorites
      summary: Добавление предложения в избранное
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Предложение добавлено в избранное.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - favorites
      summary: Удаление предложения из избранного
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Предложение удалено из избранного.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /offers/{offerId}/comments:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - comments
      summary: Список комментариев к предложению
      security: []
      description: |-
        Возвращает не больше 50 последних комментариев, отсортированных по дате публикации
        (сначала новые). Доступно всем клиентам.
      responses:
        '200':
          description: Список комментариев.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - comments
      summary: Добавление комментария
      description: Добавляет комментарий к предложению. Автором становится текущий пользователь.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
      responses:
        '201':
          description: Комментарий добавлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OfferId:
      name: offerId
      in: path
      required: true
      description: Идентификатор предложения.
      schema:
        type: string
        example: 6720f1a2b3c4d5e6f7a8b9c0

  responses:
    BadRequest:
      description: Данные не прошли валидацию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Клиент не авторизован.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Нет прав на это действие (например, предложение принадлежит другому пользователю).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    City:
      type: string
      enum:
        - Paris
        - Cologne
        - Brussels
        - Amsterdam
        - Hamburg
        - Dusseldorf
      example: Paris

    HousingType:
      type: string
      enum:
        - apartment
        - house
        - room
        - hotel
      example: apartment

    Amenity:
      type: string
      enum:
        - Breakfast
        - Air conditioning
        - Laptop friendly workspace
        - Baby seat
        - Washer
        - Towels
        - Fridge
      example: Breakfast

    UserType:
      type: string
      enum:
        - regular
        - pro
      example: regular

    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 48.85661
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 2.351499

    User:
      type: object
      properties:
        id:
          type: string
          example: 6720f1a2b3c4d5e6f7a8b9c1
        name:
          type: string
          example: Anna
        email:
          type: string
          format: email
          example: anna.petrova@mail.ru
        avatarUrl:
          type: string
          description: Если аватар не загружен, возвращается изображение по умолчанию.
          example: /static/default-avatar.png
        type:
          $ref: '#/components/schemas/UserType'

    CreateUser:
      type: object
      required:
        - name
        - email
        - password
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: Anna
        email:
          type: string
          format: email
          example: anna.petrova@mail.ru
        password:
          type: string
          minLength: 6
          maxLength: 12
          example: secret123
        type:
          $ref: '#/components/schemas/UserType'

    LoginUser:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: anna.petrova@mail.ru
        password:
          type: string
          example: secret123

    AuthToken:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjEifQ.signature
        user:
          $ref: '#/components/schemas/User'

    OfferPreview:
      type: object
      description: Краткая информация о предложении для списков.
      properties:
        id:
          type: string
          example: 6720f1a2b3c4d5e6f7a8b9c0
        title:
          type: string
          example: Cozy studio near the Eiffel Tower
        postDate:
          type: string
          format: date-time
          example: 2026-09-12T10:15:00.000Z
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
          example: https://16.design.htmlacademy.pro/static/hotel/1.jpg
        isPremium:
          type: boolean
          example: true
        isFavorite:
          type: boolean
          example: false
        rating:
          type: number
          example: 4.8
        type:
          $ref: '#/components/schemas/HousingType'
        price:
          type: integer
          example: 1200
        commentsCount:
          type: integer
          example: 3

    Offer:
      allOf:
        - $ref: '#/components/schemas/OfferPreview'
        - type: object
          description: Полная информация о предложении.
          properties:
            description:
              type: string
              example: Bright studio with a balcony and a great view of the city.
            photos:
              type: array
              minItems: 6
              maxItems: 6
              items:
                type: string
              example:
                - https://16.design.htmlacademy.pro/static/hotel/1.jpg
                - https://16.design.htmlacademy.pro/static/hotel/2.jpg
                - https://16.design.htmlacademy.pro/static/hotel/3.jpg
                - https://16.design.htmlacademy.pro/static/hotel/4.jpg
                - https://16.design.htmlacademy.pro/static/hotel/5.jpg
                - https://16.design.htmlacademy.pro/static/hotel/6.jpg
            roomsCount:
              type: integer
              example: 1
            guestsCount:
              type: integer
              example: 2
            amenities:
              type: array
              items:
                $ref: '#/components/schemas/Amenity'
            author:
              $ref: '#/components/schemas/User'
            location:
              $ref: '#/components/schemas/Location'

    CreateOffer:
      type: object
      description: |-
        Данные для создания предложения. Автор берётся из токена. Дата публикации,
        рейтинг (среднее по комментариям), количество комментариев и флаг «Избранное»
        рассчитываются сервером.
      required:
        - title
        - description
        - city
        - previewImage
        - photos
        - isPremium
        - type
        - roomsCount
        - guestsCount
        - price
        - amenities
        - location
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
          example: Cozy studio near the Eiffel Tower
        description:
          type: string
          minLength: 20
          maxLength: 1024
          example: Bright studio with a balcony and a great view of the city.
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
          example: https://16.design.htmlacademy.pro/static/hotel/1.jpg
        photos:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
        isPremium:
          type: boolean
          example: true
        type:
          $ref: '#/components/schemas/HousingType'
        roomsCount:
          type: integer
          minimum: 1
          maximum: 8
          example: 1
        guestsCount:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
        price:
          type: integer
          minimum: 100
          maximum: 100000
          example: 1200
        amenities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Amenity'
        location:
          $ref: '#/components/schemas/Location'

    UpdateOffer:
      type: object
      description: Те же поля, что и при создании, но все необязательные. Передаются только изменяемые.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 1024
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
        photos:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
        isPremium:
          type: boolean
        type:
          $ref: '#/components/schemas/HousingType'
        roomsCount:
          type: integer
          minimum: 1
          maximum: 8
        guestsCount:
          type: integer
          minimum: 1
          maximum: 10
        price:
          type: integer
          minimum: 100
          maximum: 100000
        amenities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Amenity'
        location:
          $ref: '#/components/schemas/Location'

    Comment:
      type: object
      properties:
        id:
          type: string
          example: 6720f1a2b3c4d5e6f7a8b9c2
        text:
          type: string
          example: Great place, would stay again!
        postDate:
          type: string
          format: date-time
          example: 2026-10-01T12:00:00.000Z
        rating:
          type: integer
          example: 5
        author:
          $ref: '#/components/schemas/User'

    CreateComment:
      type: object
      description: Дата публикации и автор комментария определяются сервером.
      required:
        - text
        - rating
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 1024
          example: Great place, would stay again!
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

    Error:
      type: object
      properties:
        message:
          type: string
          example: Предложение не найдено
        details:
          type: array
          description: Список ошибок валидации по полям, если они есть.
          items:
            type: object
            properties:
              property:
                type: string
                example: title
              messages:
                type: array
                items:
                  type: string
                example:
                  - title must be longer than or equal to 10 characters
